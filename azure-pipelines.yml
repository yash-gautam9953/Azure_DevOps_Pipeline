trigger:
- main

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: '4039e7ef-f2df-44a5-9864-3364a7ab767d'
  imageRepository: 'azure-cicd-app'
  containerRegistry: 'codealphacontainer02.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  azureSubscription: 'CodeAlpha-Azure-Connection'
  appName: 'codealpha-cicd-app-2026'

pool:
  name: 'CodeAlpha-SelfHosted'

stages:

- stage: Build
  displayName: Build and Push

  jobs:
  - job: Build
    displayName: Build Docker Image

    steps:

    - task: Docker@2
      displayName: Build and Push Docker Image
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)


- stage: Deploy
  displayName: Deploy to Azure App Service

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: Deploy Application

    steps:

    - task: AzureWebAppContainer@1
      displayName: Deploy Docker Container
      inputs:
        azureSubscription: $(azureSubscription)
        appName: $(appName)
        containers: $(containerRegistry)/$(imageRepository):$(tag)
